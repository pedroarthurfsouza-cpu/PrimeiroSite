<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#202124;
    font-family:Arial, Helvetica, sans-serif;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:16px 32px;
    font-size:1rem;
    border-radius:12px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#1d4ed8;
    transform:scale(1.05);
}

button:active{
    transform:scale(0.95);
}
</style>

</head>
<body>

<button>Clique aqui</button>

</body>
</html>
