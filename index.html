<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomePage - NetLinks</title>

    <style>
        a {
            text-decoration: none;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), ;
            background-position: center;
            background-size: cover;
        }

        .barra-superior {
            background-color: #ff0b0b;
            height: 100px;
            width: 100%;
            background-image: linear-gradient(to right, #6e53b9, #ff0000);
        }

        .titulo-principal {
            color: #fcfdfc;
            text-align: center;
            padding-top: 20px;
            font-size: 60px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        .links-iniciais {
            text-align: center;
            margin: 20px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        
        .links-iniciais :hover {
            text-align: center;
            margin: 20px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            text-decoration: underline;
        }


        .links-uteis {
            font-size: xx-large;
            color: #fc0000;
            text-align: center;
        }

        .citacao {
            color: rgb(0, 0, 0);
            font-size: xx-large;
            text-align: center;
            background-color: rgba(167, 23, 23, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            margin: 20px;
            border: 1px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .BotaoDeEnvio {
            background-color: whitesmoke;
            font-size: x-large;
            padding: 6px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;

        }

        .blocoDeEscrita {
            font-size: x-large;
        }

        .textoQualquer {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
    </style>



</head>

<body>

    <div class="barra-superior">
        <div>
            <h1 class="titulo-principal">NetLinks</h1>
        </div>
    </div>

    <div class="links-iniciais">
        <a href="hrCC2TA.html" class="links-uteis">Horário CC2TA</a>
        <br>
        <a href="https://github.com/pedroarthurfsouza-cpu" class="links-uteis">Meu GitHub</a>
        <br>
        <a href="hrCC2TA-CSS.html" class="links-uteis">Horário CC2TA ESTILIZADO</a>
    </div>

    <form class="citacao">

        <label for="nome" class="textoQualquer">Digite seu nome</label><br>
        <input id="nome" class="blocoDeEscrita" placeholder="Nome"><br>
        <label for="idade" class="textoQualquer">Digite sua idade</label><br>
        <input id="idade" class="blocoDeEscrita" placeholder="Idade"><br>
        <input type="submit" class="botaoDeEnvio" id="meubotao">

    </form>

    <div class="citacao">
        <button id="meubotao2" class="BotaoDeEnvio">
            Clique Aqui para enviar a informações!
        </button>
    </div>

    <div class="citacao">
        <blockquote>
            "Nesse mundo passareis por aflições, mas tende bom ânimo! Eu venci o mundo."
        </blockquote>
    </div>



    <script>
        const botao = document.getElementById("meubotao");
        botao.addEventListener("click", () => alert("Aura Demais - Suas informações foram enviadas com sucesso!"));

        const botao2 = document.getElementById("meubotao2");
        botao2.addEventListener("click", () => alert("Aura Demais - Suas informações foram enviadas com sucesso!"));
    </script>

</body>

</html>
