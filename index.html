<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomePage - NetLinks</title>

<style>

    a {
        text-decoration: none;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

body{
    background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url("https://www.opentext.com/assets/images/products-solutions/solution-industry-category/opentext-image-ov-hightech-en.jpg");
    background-position: center;
    background-size: cover;
}

.barra-superior {
    background-color: #ff0b0b;
    height: 100px;
    width: 100%;
    background-image: linear-gradient(to right, #6e53b9, #ff0000);
}

.titulo-principal {
    color: #fcfdfc;
    text-align: center;
    padding-top: 20px;
    font-size: 60px;
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
}

.links-iniciais{
    text-align: center;
    margin: 20px;
}

.link-github{
    font-size: xx-large;
    color: #fff;
    text-align: center;
}

.citacao{
    color:white;
    font-size: xx-large;
    text-align: center;
    background-color:rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    border: 1px;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
}

.BotaoDaAura{
    background-color: whitesmoke;
    font-size: x-large;
    
}
</style>



</head>
<body>

<div class = "barra-superior">
    <div>
        <h1 class = "titulo-principal">Urubu do Pix</h1>
    </div>
</div>

<div class = "links-iniciais">
    <a href="https://github.com/pedroarthurfsouza-cpu" class = "link-github">Meu GitHub</a>
</div>

<div class = "citacao">
    <blockquote>
        Com grandes poderes, vem grandes responsabilidades.
    </blockquote>
</div>
<div class = "citacao">
<button id= "meubotao" class="BotaoDaAura">
    Clique Aqui - Botao da AURA
</button>
</div>





<script>
    const botao = document.getElementById("meubotao");
    botao.addEventListener("click", ()=> alert("Aura Demais"));
</script>

</body>
</html>
